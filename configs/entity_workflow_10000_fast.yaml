# v4固定哈希1万商品；规模化脚本标定并发后选择；完整五步，不构图不训练。
data:
  format: amazon2023
  protocol: paper
  split_seed: 42
  reviews: data/raw/amazon2023/CDs_and_Vinyl.jsonl.gz
  metadata: data/raw/amazon2023/meta_CDs_and_Vinyl.jsonl.gz
  output: data/processed/amazon_cds_paper_drop_session_v4
  min_user_events: 3
  min_item_events: 5
  max_session_length: 20
  train_ratio: 0.9
  valid_ratio: 0.0
  user_sample_modulus: 1
  threads: 4
model:
  dim: 256
  layers: 2
  dropout: 0.2
  use_item_features: true
  candidate_chunk_size: 2048
  use_global: true
  global_layers: 2
training:
  device: auto
  seed: 42
  selection: last_epoch
  batch_size: 100
  learning_rate: 0.001
  epochs: 20
  patience: 3
  top_k: 20
  run_dir: runs/paper_drop_session_v4_global_attrs
  cuda_memory_fraction: 0.1
graph:
  path: data/graphs/paper_drop_session_v4/behavior.json
entities:
  alias_threshold: 0.9
  api_key_env: ESE_ENTITY_API_KEY
  base_url: http://127.0.0.1:18888/v1
  chunk_size: 1600
  continue_on_error: true
  limit: 10000
  max_alias_pairs: 1000000
  max_output_tokens: 4096
  max_requests: 500000
  max_rounds: 3
  max_split_depth: 3
  min_chunk_chars: 200
  model: Qwen3-30B-A3B-Instruct-2507
  output: runs/entity_scale_10000_20261101/production/entities
  overlap: 200
  request_attempts: 3
  timeout_seconds: 360
  concurrency: 32
  candidate_top_k: 8
  candidate_min_similarity: 0.65
  concise_outputs: true
  build_graphs: false
