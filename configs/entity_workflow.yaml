data:
  format: amazon2023
  protocol: paper
  split_seed: 42
  reviews: data/raw/amazon2023/CDs_and_Vinyl.jsonl.gz
  metadata: data/raw/amazon2023/meta_CDs_and_Vinyl.jsonl.gz
  output: data/processed/amazon_cds_paper_v1
  min_user_events: 3
  min_item_events: 5
  max_session_length: 20
  train_ratio: 0.9
  valid_ratio: 0.0
  user_sample_modulus: 1
  threads: 4
model:
  dim: 256
  layers: 2
  dropout: 0.2
  use_item_features: false
  candidate_chunk_size: 2048
  use_global: true
  global_layers: 2
training:
  device: auto
  seed: 42
  selection: last_epoch
  batch_size: 100
  learning_rate: 0.001
  epochs: 20
  patience: 3
  top_k: 20
  run_dir: runs/paper_workflow_smoke_v1
  cuda_memory_fraction: 0.1
graph:
  path: data/graphs/paper_fused_workflow_smoke_v3.json
  behavior_path: data/graphs/paper_behavior_v1.json
  semantic_path: data/graphs/paper_semantic_workflow_smoke_v3.json
  beta: 0.5
  top_k: 20
  max_candidate_pairs: 50000000
entities:
  base_url: http://127.0.0.1:18888/v1
  model: Qwen3-30B-A3B-Instruct-2507
  api_key_env: ESE_ENTITY_API_KEY
  output: data/entities/paper_workflow_smoke_v3
  max_requests: 160
  max_output_tokens: 1536
  timeout_seconds: 180
  limit: 3
  chunk_size: 1600
  overlap: 200
  max_rounds: 3
  max_alias_pairs: 8
  alias_threshold: 0.9
  item_ids:
  - 49977
  - 12823
  - 5848
